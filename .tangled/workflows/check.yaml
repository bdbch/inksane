when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: "nixery"

dependencies:
  nixpkgs:
    - nodejs_22
    - gnused

steps:
  - name: "Install dependencies"
    command: |
      corepack enable
      pnpm install --frozen-lockfile
  - name: "Lint"
    command: "pnpm exec vp check"
  - name: "Test"
    command: "pnpm exec vp run -r test"
