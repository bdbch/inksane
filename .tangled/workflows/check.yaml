when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - nodejs
  - pnpm
  - patchelf
  - github:ryoppippi/nix-vite-plus#vp

steps:
  - name: "Install dependencies"
    command: |
      vp install
      # Fix vp's downloaded Node binary for NixOS
      NODE_BIN=$(find .vite-plus/js_runtime/node -name node -type f | head -1)
      INTERPRETER=$(patchelf --print-interpreter $(which node))
      RPATH=$(patchelf --print-rpath $(which node))
      patchelf --set-interpreter "$INTERPRETER" "$NODE_BIN"
      patchelf --set-rpath "$RPATH" "$NODE_BIN"

  - name: "Run Linter"
    command: "vp check"
