packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
  "@codemirror/commands": ^6.11.1
  "@codemirror/search": ^6.7.2
  "@codemirror/state": ^6.7.1
  "@codemirror/view": ^6.43.7
  "@codemirror/lang-cpp": ^6.0.3
  "@codemirror/lang-css": ^6.3.1
  "@codemirror/lang-go": ^6.0.1
  "@codemirror/lang-html": ^6.4.12
  "@codemirror/lang-java": ^6.0.2
  "@codemirror/lang-javascript": ^6.2.5
  "@codemirror/lang-json": ^6.0.2
  "@codemirror/lang-markdown": ^6.5.0
  "@codemirror/lang-php": ^6.0.2
  "@codemirror/lang-python": ^6.2.1
  "@codemirror/lang-rust": ^6.0.2
  "@codemirror/lang-sql": ^6.10.0
  "@codemirror/lang-xml": ^6.1.0
  "@codemirror/lang-yaml": ^6.1.3
  "@codemirror/language": ^6.12.4
  "@codemirror/legacy-modes": ^6.5.5
  "@lezer/common": ^1.5.3
  "@lezer/highlight": ^1.2.5
  "@lezer/markdown": ^1.0.0
  jsdom: ^30.0.1
  yjs: ^13.6.33
  y-codemirror.next: ^0.3.6
  y-protocols: ^1.0.7
  "@tailwindcss/vite": ^4.3.3
  tailwindcss: ^4.3.3
  astro: ^7.3.5
  "@fontsource/hanken-grotesk": ^5.3.0
  "@tailwindcss/typography": ^0.5.20
  "@astrojs/react": ^7.0.1
  "@astrojs/mdx": ^8.0.3
  "@astrojs/markdown-remark": ^7.3.2
  fumadocs-core: ^16.17.2
  fumadocs-ui: ^16.17.2
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Languages and highlight styles must share one tag and prop registry.
  "@lezer/common": "catalog:"
  "@lezer/highlight": "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - fumadocs-core@16.17.2
  - fumadocs-ui@16.17.2
