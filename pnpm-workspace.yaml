packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: latest
  "@codemirror/state": ^6.7.1
  "@codemirror/view": ^6.43.7
  "@codemirror/lang-markdown": ^6.5.0
  "@codemirror/language": ^6.12.4
  "@lezer/common": ^1.5.0
  "@lezer/markdown": ^1.0.0
  jsdom: ^30.0.1
  "@tailwindcss/vite": ^4.3.3
  tailwindcss: ^4.3.3
  astro: ^7.2.0
  "@fontsource/hanken-grotesk": ^5.3.0
  "@tailwindcss/typography": ^0.5.20
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
