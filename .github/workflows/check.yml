name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      # Generated types give Astro its collection schemas and React JSX namespace.
      - name: Sync Astro types
        run: |
          pnpm --filter @inksane-internal/docs --fail-if-no-match run sync
          pnpm --filter @inksane-internal/playground --fail-if-no-match exec astro sync

      - name: Lint
        run: pnpm exec vp check

      - name: Test
        run: pnpm exec vp run -r test

  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release bump files
        run: pnpm exec bumpy ci check --strict
        env:
          GH_TOKEN: ${{ github.token }}
