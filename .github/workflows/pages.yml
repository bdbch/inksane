name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - apps/playground/**
      - apps/docs/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.18.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A Pages deployment replaces the whole site, so both apps build here and are
      # assembled into one artifact: the playground at the root, the docs under /docs.
      - name: Build playground
        run: pnpm --filter @inksane/playground exec astro build --base "${{ steps.pages.outputs.base_path }}"

      - name: Build docs
        run: pnpm --filter @inksane/docs exec astro build
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}/docs

      - name: Assemble the site
        run: |
          mkdir -p _site/docs
          cp -R apps/playground/dist/. _site/
          cp -R apps/docs/dist/. _site/docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
